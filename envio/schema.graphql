# Port of ../indexer/tydro/schema.graphql. Entity and field names are unchanged.
# Differences: no @entity directives (every type is an entity in HyperIndex);
# Bytes ids become ID! holding the same 0x hex; Bytes fields are stored as hex strings.

"A Tydro reserve (asset) seen by the Pool."
type Reserve {
  "Underlying asset address"
  id: ID!
  symbol: String!
  decimals: Int!
  firstSeenBlock: BigInt!
  events: [PoolEvent!]! @derivedFrom(field: "reserve")
  snapshots: [ReserveSnapshot!]! @derivedFrom(field: "reserve")
}

"""
One user-facing Pool event. `type` is one of:
supply, withdraw, borrow, repay, liquidation, collateral_change, flash_loan.
Bookkeeping events (ReserveDataUpdated, MintedToTreasury, IsolationModeTotalDebtUpdated) are not stored.
"""
type PoolEvent {
  "txHash ++ logIndex (little-endian int32)"
  id: ID!
  type: String!
  reserve: Reserve!
  "Position owner: onBehalfOf (supply/borrow), user (withdraw/repay/liquidated user/collateral), initiator (flash loan)"
  user: String!
  "Raw amount in reserve decimals; debtToCover for liquidations; 0 for collateral_change"
  amount: BigInt!
  caller: String
  interestRateMode: Int
  usedAsCollateral: Boolean
  collateralAsset: String
  liquidatedCollateralAmount: BigInt
  liquidator: String
  premium: BigInt
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: String!
  logIndex: BigInt!
}

"Reserve state read on-chain every 3600 blocks (~1h)."
type ReserveSnapshot {
  "reserve ++ blockNumber (little-endian int32)"
  id: ID!
  reserve: Reserve!
  blockNumber: BigInt!
  timestamp: BigInt!
  totalSupplied: BigInt!
  totalBorrowed: BigInt!
  "ray (1e27) APR"
  liquidityRate: BigInt!
  "ray (1e27) APR"
  variableBorrowRate: BigInt!
  "TydroOracle price, 1e8 = 1 USD; null if the oracle call reverted"
  priceUsd: BigInt
}
